name: Run AFK Bot
on: [workflow_dispatch]
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install Dependencies
        run: npm install mineflayer
      - name: Run Bot Continuously
        run: |
          node index.js &
          sleep infinity
